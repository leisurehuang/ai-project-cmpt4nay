# ============================================
# 秦腔文化科普网站 - GitHub Actions 自动部署工作流
# 监听主分支 push 事件，自动构建前端并部署到 GitHub Pages
# ============================================

name: 构建并部署至 GitHub Pages

on:
  push:
    branches: ['main']
  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      # 步骤1: 检出代码
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # 步骤2: 配置 Node.js 环境
      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 步骤3: 安装前端依赖
      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      # 步骤4: 构建前端 Astro 项目
      - name: 构建 Astro 静态站点
        run: |
          cd frontend
          npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://your-username.github.io' }}

      # 步骤5: 验证构建产物
      - name: 验证构建产物
        run: |
          echo '📂 构建产物目录内容:'
          ls -la frontend/dist/
          echo ''
          echo '📄 检查 index.html 是否存在:'
          if [ -f frontend/dist/index.html ]; then
            echo '✅ index.html 存在，构建成功'
          else
            echo '❌ index.html 不存在，构建失败'
            exit 1
          fi
          echo ''
          echo '📊 构建产物大小:'
          du -sh frontend/dist/

      # 步骤6: 上传构建产物
      - name: 上传构建产物到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 步骤1: 部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
